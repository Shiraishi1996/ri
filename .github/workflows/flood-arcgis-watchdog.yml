name: Flood ArcGIS stale-feed watchdog

on:
  workflow_dispatch:
  schedule:
    # Independent recovery check, five minutes after the primary 10-minute slot.
    # Changing cron also reactivates schedules disabled after repository inactivity.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check feed age and recover if stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          let stale = true;
          try {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const s = await r.json();
            const t = Date.parse(s.generated_at || '');
            const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
            const count = Number(s.feature_count || 0);
            console.log(`generated_at=${s.generated_at}; age=${age.toFixed(1)} min; features=${count}`);
            stale = age >= 12 || count < 20000;
          } catch (e) {
            console.log(`status check failed: ${e.message}`);
            stale = true;
          }
          if (!stale) {
            console.log('feed is fresh; no recovery dispatch needed');
            process.exit(0);
          }
          console.log('feed is stale; dispatching primary workflow');
          const api = 'https://api.github.com/repos/Shiraishi1996/ri/actions/workflows/flood-arcgis-live.yml/dispatches';
          const rr = await fetch(api, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ ref: 'main' })
          });
          if (!rr.ok) throw new Error(`workflow dispatch failed ${rr.status}: ${await rr.text()}`);
          console.log('recovery workflow dispatched');
          NODE
