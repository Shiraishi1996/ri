name: Publish flood GeoJSON for ArcGIS

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-arcgis-live.yml"

permissions:
  contents: write

concurrency:
  group: flood-arcgis-live
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Generate current GeoJSON from flood-jp
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto('https://flood-jp.netlify.app', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.arcgisState?.().ready === true, null, { timeout: 300000, polling: 2000 });
            const fc = await page.evaluate(() => window.arcgisBuildGeoJSON());
            if (!fc?.features?.length) throw new Error('GeoJSON features are empty');
            await writeFile('/tmp/flood_5km.geojson', JSON.stringify(fc));
            await writeFile('/tmp/status.json', JSON.stringify({
              generated_at: fc?.metadata?.generated_at || new Date().toISOString(),
              feature_count: fc.features.length,
              model_version: fc?.metadata?.model_version || 'unknown',
              source: 'https://flood-jp.netlify.app'
            }));
            console.log(`generated ${fc.features.length} features`);
          } finally {
            await browser.close();
          }
          NODE
      - name: Publish latest-only data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flood-live-data
          git rm -rf . || true
          cp /tmp/flood_5km.geojson ./flood_5km.geojson
          cp /tmp/status.json ./status.json
          cat > README.md <<'EOF'
          # Flood JP live ArcGIS feed
          This branch is overwritten every 10 minutes by GitHub Actions.
          EOF
          git add flood_5km.geojson status.json README.md
          git commit -m "Update live flood GeoJSON"
          git push --force origin flood-live-data
