name: Publish flood GeoJSON for ArcGIS

on:
  workflow_dispatch:
  schedule:
    # Re-register the scheduled actor after the repository's long inactivity.
    # Primary publication every 10 minutes, deliberately away from :00.
    - cron: "2,12,22,32,42,52 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-arcgis-live.yml"
      - ".github/workflows/flood-arcgis-watchdog.yml"

permissions:
  contents: write

concurrency:
  group: flood-arcgis-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check current feed freshness
        id: freshness
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const event = process.env.GITHUB_EVENT_NAME || '';
          // Manual/push runs always regenerate so workflow edits also act as a recovery trigger.
          if (event !== 'schedule') {
            console.log('skip=false');
            console.error(`event=${event}: force regeneration`);
            process.exit(0);
          }
          const url = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          try {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) throw new Error(`status HTTP ${r.status}`);
            const s = await r.json();
            const t = Date.parse(s.generated_at || '');
            const ageMin = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
            console.error(`current generated_at=${s.generated_at}; age=${ageMin.toFixed(1)} min`);
            console.log(`skip=${ageMin < 8 ? 'true' : 'false'}`);
          } catch (e) {
            console.error(`freshness check failed: ${e.message}; regenerate`);
            console.log('skip=false');
          }
          NODE

      - name: Install Playwright
        if: steps.freshness.outputs.skip != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Generate current GeoJSON from flood-jp
        if: steps.freshness.outputs.skip != 'true'
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "generation attempt ${attempt} at $(date -u +%FT%TZ)"
            if node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            page.on('console', m => console.log(`[browser] ${m.type()}: ${m.text()}`));
            await page.goto('https://flood-jp.netlify.app', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.arcgisState?.().ready === true, null, { timeout: 480000, polling: 2000 });
            const fc = await page.evaluate(() => window.arcgisBuildGeoJSON());
            if (!fc?.features?.length) throw new Error('GeoJSON features are empty');
            if (fc.features.length < 20000) throw new Error(`unexpectedly small feature count: ${fc.features.length}`);
            const generatedAt = fc?.metadata?.generated_at || new Date().toISOString();
            await writeFile('/tmp/flood_5km.geojson', JSON.stringify(fc));
            await writeFile('/tmp/status.json', JSON.stringify({
              generated_at: generatedAt,
              published_at: new Date().toISOString(),
              feature_count: fc.features.length,
              model_version: fc?.metadata?.model_version || 'unknown',
              source: 'https://flood-jp.netlify.app',
              publisher: 'github-actions',
              cadence_minutes: 10,
              watchdog_offset_minutes: 5,
              workflow_run_id: process.env.GITHUB_RUN_ID || null,
              workflow_event: process.env.GITHUB_EVENT_NAME || null
            }));
            console.log(`generated ${fc.features.length} features at ${generatedAt}`);
          } finally {
            await browser.close();
          }
          NODE
            then
              success=1
              break
            fi
            echo "attempt ${attempt} failed"
            sleep 20
          done
          if [ "$success" != "1" ]; then
            echo "all generation attempts failed" >&2
            exit 1
          fi

      - name: Publish latest-only data branch
        if: steps.freshness.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flood-live-data
          git rm -rf . || true
          cp /tmp/flood_5km.geojson ./flood_5km.geojson
          cp /tmp/status.json ./status.json
          cat > README.md <<'EOF'
          # Flood JP live ArcGIS feed
          The primary GitHub Actions scheduler publishes every 10 minutes.
          A separate watchdog runs 5 minutes later and dispatches recovery if the feed is stale.
          ArcGIS should reference the raw flood_5km.geojson URL and refresh every 10 minutes.
          EOF
          git add flood_5km.geojson status.json README.md
          git commit -m "Update live flood GeoJSON"
          git push --force origin flood-live-data

      - name: Verify public feed after publication
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const urlBase = 'https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json';
          let lastError = '';
          for (let attempt = 1; attempt <= 6; attempt++) {
            try {
              const r = await fetch(`${urlBase}?ts=${Date.now()}`, { cache: 'no-store' });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              const s = await r.json();
              const t = Date.parse(s.generated_at || '');
              const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
              const count = Number(s.feature_count || 0);
              console.log(`public feed attempt=${attempt}: age=${age.toFixed(2)} min, features=${count}`);
              if (age <= 12 && count >= 20000) process.exit(0);
              lastError = `stale/short feed: age=${age.toFixed(2)}, features=${count}`;
            } catch (e) {
              lastError = e.message;
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          throw new Error(`public feed verification failed: ${lastError}`);
          NODE

      - name: Fresh feed - no regeneration needed
        if: steps.freshness.outputs.skip == 'true'
        run: echo "Current GeoJSON is younger than 8 minutes; scheduled run completed without regeneration."
