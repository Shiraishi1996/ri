name: CrossView flood live publisher daemon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-crossview-live-v2.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: crossview-flood-publisher-daemon
  cancel-in-progress: false

jobs:
  publish-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Playwright once
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Publish every 10 minutes without GitHub cron
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for cycle in $(seq 1 24); do
            echo "===== CrossView daemon cycle ${cycle}/24: $(date -u +%FT%TZ) ====="
            success=0

            for attempt in 1 2 3; do
              echo "generation attempt ${attempt}"
              CYCLE="$cycle" node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const cycle = Number(process.env.CYCLE || 0);
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            page.on('console', m => console.log(`[browser] ${m.type()}: ${m.text()}`));
            await page.goto('https://flood-jp.netlify.app', {
              waitUntil: 'domcontentloaded',
              timeout: 120000
            });
            await page.waitForFunction(
              () => window.arcgisState?.().ready === true,
              null,
              { timeout: 480000, polling: 2000 }
            );
            const fc = await page.evaluate(() => window.arcgisBuildGeoJSON());
            if (!fc?.features?.length) throw new Error('GeoJSON features are empty');
            if (fc.features.length < 20000) {
              throw new Error(`unexpectedly small feature count: ${fc.features.length}`);
            }
            const generatedAt = fc?.metadata?.generated_at || new Date().toISOString();
            await writeFile('/tmp/flood_5km.geojson', JSON.stringify(fc));
            await writeFile('/tmp/status.json', JSON.stringify({
              generated_at: generatedAt,
              published_at: new Date().toISOString(),
              feature_count: fc.features.length,
              model_version: fc?.metadata?.model_version || 'unknown',
              source: 'https://flood-jp.netlify.app',
              publisher: 'github-actions-daemon-v3',
              scheduler_version: 3,
              cadence_minutes: 10,
              daemon_cycle: cycle,
              workflow_run_id: process.env.GITHUB_RUN_ID || null,
              workflow_event: process.env.GITHUB_EVENT_NAME || null
            }));
            console.log(`generated ${fc.features.length} features at ${generatedAt}`);
          } finally {
            await browser.close();
          }
          NODE
              if [ $? -eq 0 ]; then
                success=1
                break
              fi
              sleep 20
            done

            if [ "$success" = "1" ]; then
              rm -rf /tmp/crossview-feed
              git worktree prune
              git worktree add --detach /tmp/crossview-feed HEAD
              cd /tmp/crossview-feed
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout --orphan flood-live-data-next
              git rm -rf . >/dev/null 2>&1 || true
              cp /tmp/flood_5km.geojson ./flood_5km.geojson
              cp /tmp/status.json ./status.json
              cat > README.md <<'EOF'
          # Flood JP live CrossView feed
          Published by a self-chaining GitHub Actions daemon every 10 minutes.
          This path does not depend on GitHub scheduled/cron workflow delivery.
          CrossView/ArcGIS should reference the raw flood_5km.geojson URL.
          EOF
              git add flood_5km.geojson status.json README.md
              git commit -m "Update CrossView live flood GeoJSON"
              git push --force origin HEAD:flood-live-data
              publish_rc=$?
              cd "$GITHUB_WORKSPACE"
              git worktree remove --force /tmp/crossview-feed >/dev/null 2>&1 || true

              if [ "$publish_rc" = "0" ]; then
                EXPECTED_RUN="$GITHUB_RUN_ID" node --input-type=module <<'NODE'
          const base = 'https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json';
          const expectedRun = String(process.env.EXPECTED_RUN || '');
          let ok = false;
          let last = '';
          for (let i = 1; i <= 30; i++) {
            try {
              const r = await fetch(`${base}?ts=${Date.now()}-${i}`, { cache: 'no-store' });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              const s = await r.json();
              const age = (Date.now() - Date.parse(s.generated_at || '')) / 60000;
              const count = Number(s.feature_count || 0);
              const exact = String(s.workflow_run_id || '') === expectedRun && s.publisher === 'github-actions-daemon-v3';
              console.log(`public verify ${i}: age=${age.toFixed(2)} min features=${count} exactRun=${exact}`);
              if (exact && age <= 5 && count >= 20000) { ok = true; break; }
              last = `run=${s.workflow_run_id}, age=${age}, features=${count}`;
            } catch (e) {
              last = e.message;
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          if (!ok) throw new Error(`public feed did not expose this daemon run: ${last}`);
          NODE
                verify_rc=$?
                if [ "$verify_rc" != "0" ]; then
                  echo "WARNING: publication propagation verification failed; daemon will continue"
                fi
              else
                echo "WARNING: git publication failed; daemon will continue"
              fi
            else
              echo "WARNING: all three generation attempts failed; keeping previous feed and continuing"
            fi

            if [ "$cycle" -lt 24 ]; then
              echo "sleeping 600 seconds until next live update"
              sleep 600
            fi
          done
          exit 0

      - name: Relay to next daemon run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "dispatching successor daemon run"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/dispatch-response.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/flood-crossview-live-v2.yml/dispatches \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "successor dispatched"
              exit 0
            fi
            echo "dispatch attempt ${attempt} failed: HTTP ${code}"
            cat /tmp/dispatch-response.txt || true
            sleep 5
          done
          exit 1
