name: CrossView flood live publisher v2

on:
  workflow_dispatch:
  schedule:
    # Fresh workflow identity to avoid inheriting a schedule disabled by long repo inactivity.
    # Every 10 minutes, offset from the top of the hour where GitHub reports heavier load.
    - cron: "9,19,29,39,49,59 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-crossview-live-v2.yml"

permissions:
  contents: write

concurrency:
  # Shared with any legacy publisher run that may still be finishing.
  group: flood-arcgis-live
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check current feed freshness
        id: freshness
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const event = process.env.GITHUB_EVENT_NAME || '';
          if (event !== 'schedule') {
            console.log('skip=false');
            console.error(`event=${event}: force regeneration`);
            process.exit(0);
          }
          const url = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          try {
            const r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) throw new Error(`status HTTP ${r.status}`);
            const s = await r.json();
            const t = Date.parse(s.generated_at || '');
            const ageMin = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
            const count = Number(s.feature_count || 0);
            console.error(`current generated_at=${s.generated_at}; age=${ageMin.toFixed(1)} min; features=${count}`);
            console.log(`skip=${ageMin < 8 && count >= 20000 ? 'true' : 'false'}`);
          } catch (e) {
            console.error(`freshness check failed: ${e.message}; regenerate`);
            console.log('skip=false');
          }
          NODE

      - name: Install Playwright
        if: steps.freshness.outputs.skip != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install chromium

      - name: Generate current 5 km GeoJSON
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "generation attempt ${attempt} at $(date -u +%FT%TZ)"
            if node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            page.on('console', m => console.log(`[browser] ${m.type()}: ${m.text()}`));
            await page.goto('https://flood-jp.netlify.app', { waitUntil: 'domcontentloaded', timeout: 120000 });
            await page.waitForFunction(() => window.arcgisState?.().ready === true, null, { timeout: 480000, polling: 2000 });
            const fc = await page.evaluate(() => window.arcgisBuildGeoJSON());
            if (!fc?.features?.length) throw new Error('GeoJSON features are empty');
            if (fc.features.length < 20000) throw new Error(`unexpectedly small feature count: ${fc.features.length}`);
            const generatedAt = fc?.metadata?.generated_at || new Date().toISOString();
            await writeFile('/tmp/flood_5km.geojson', JSON.stringify(fc));
            await writeFile('/tmp/status.json', JSON.stringify({
              generated_at: generatedAt,
              published_at: new Date().toISOString(),
              feature_count: fc.features.length,
              model_version: fc?.metadata?.model_version || 'unknown',
              source: 'https://flood-jp.netlify.app',
              publisher: 'github-actions-v2',
              scheduler_version: 2,
              cadence_minutes: 10,
              watchdog_offset_minutes: 5,
              workflow_run_id: process.env.GITHUB_RUN_ID || null,
              workflow_event: process.env.GITHUB_EVENT_NAME || null
            }));
            console.log(`generated ${fc.features.length} features at ${generatedAt}`);
          } finally {
            await browser.close();
          }
          NODE
            then
              success=1
              break
            fi
            echo "attempt ${attempt} failed"
            sleep 20
          done
          if [ "$success" != "1" ]; then
            echo "all generation attempts failed" >&2
            exit 1
          fi

      - name: Publish latest-only data branch
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan flood-live-data
          git rm -rf . || true
          cp /tmp/flood_5km.geojson ./flood_5km.geojson
          cp /tmp/status.json ./status.json
          cat > README.md <<'EOF'
          # Flood JP live CrossView feed
          Generated by the v2 GitHub Actions workflow every 10 minutes.
          A separate v2 watchdog checks the public feed five minutes later.
          CrossView/ArcGIS should reference the raw flood_5km.geojson URL.
          EOF
          git add flood_5km.geojson status.json README.md
          git commit -m "Update CrossView live flood GeoJSON"
          git push --force origin flood-live-data

      - name: Verify this exact run is visible on public feed
        if: steps.freshness.outputs.skip != 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json';
          const expectedRun = String(process.env.GITHUB_RUN_ID || '');
          let lastError = '';
          for (let attempt = 1; attempt <= 30; attempt++) {
            try {
              const r = await fetch(`${base}?ts=${Date.now()}-${attempt}`, { cache: 'no-store' });
              if (!r.ok) throw new Error(`HTTP ${r.status}`);
              const s = await r.json();
              const t = Date.parse(s.generated_at || '');
              const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
              const count = Number(s.feature_count || 0);
              const visibleRun = String(s.workflow_run_id || '');
              const exact = visibleRun === expectedRun && s.publisher === 'github-actions-v2';
              console.log(`public feed attempt=${attempt}: age=${age.toFixed(2)} min; features=${count}; run=${visibleRun}; expected=${expectedRun}; exact=${exact}`);
              if (exact && age <= 5 && count >= 20000) process.exit(0);
              lastError = `new run not yet visible: run=${visibleRun}, age=${age.toFixed(2)}, features=${count}`;
            } catch (e) {
              lastError = e.message;
            }
            await new Promise(r => setTimeout(r, 5000));
          }
          throw new Error(`public feed propagation verification failed: ${lastError}`);
          NODE

      - name: Verify existing feed when scheduled run is skipped as fresh
        if: steps.freshness.outputs.skip == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          const r = await fetch(url, { cache: 'no-store' });
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const s = await r.json();
          const t = Date.parse(s.generated_at || '');
          const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
          const count = Number(s.feature_count || 0);
          console.log(`fresh-skip verification: age=${age.toFixed(2)} min; features=${count}; publisher=${s.publisher}`);
          if (age >= 8 || count < 20000) throw new Error('feed became stale during scheduled skip');
          NODE
