name: CrossView flood stale-feed guardian daemon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-crossview-watchdog-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: crossview-flood-watchdog-daemon
  cancel-in-progress: false

jobs:
  watchdog-daemon:
    runs-on: ubuntu-latest
    timeout-minutes: 255
    steps:
      - name: Check feed every 5 minutes and recover publisher if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for cycle in $(seq 1 48); do
            echo "===== watchdog cycle ${cycle}/48: $(date -u +%FT%TZ) ====="
            CYCLE="$cycle" node --input-type=module <<'NODE'
          const statusUrl = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          let stale = true;
          let age = 9999;
          let count = 0;
          try {
            const r = await fetch(statusUrl, { cache: 'no-store' });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const s = await r.json();
            const t = Date.parse(s.generated_at || '');
            age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
            count = Number(s.feature_count || 0);
            console.log(`feed generated_at=${s.generated_at}; age=${age.toFixed(2)} min; features=${count}; publisher=${s.publisher}`);
            stale = age >= 15 || count < 20000;
          } catch (e) {
            console.log(`status check failed: ${e.message}`);
            stale = true;
          }

          if (!stale) {
            console.log('feed is fresh');
            process.exit(0);
          }

          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          // Avoid queuing duplicate recovery runs when a publisher is already active.
          const runsApi = 'https://api.github.com/repos/Shiraishi1996/ri/actions/workflows/flood-crossview-live-v2.yml/runs?per_page=10';
          try {
            const rr = await fetch(runsApi, { headers });
            if (rr.ok) {
              const data = await rr.json();
              const active = (data.workflow_runs || []).find(x => x.status === 'in_progress' || x.status === 'queued' || x.status === 'pending');
              if (active) {
                console.log(`feed stale but publisher already active: run=${active.id}, status=${active.status}`);
                process.exit(0);
              }
            }
          } catch (e) {
            console.log(`publisher-state check failed: ${e.message}`);
          }

          console.log(`feed stale (age=${age.toFixed(2)}, features=${count}); dispatching publisher daemon`);
          const api = 'https://api.github.com/repos/Shiraishi1996/ri/actions/workflows/flood-crossview-live-v2.yml/dispatches';
          let lastError = '';
          for (let attempt = 1; attempt <= 3; attempt++) {
            const rr = await fetch(api, {
              method: 'POST',
              headers: { ...headers, 'Content-Type': 'application/json' },
              body: JSON.stringify({ ref: 'main' })
            });
            if (rr.ok) {
              console.log(`recovery publisher dispatched on attempt ${attempt}`);
              process.exit(0);
            }
            lastError = `${rr.status}: ${await rr.text()}`;
            console.log(`dispatch attempt ${attempt} failed: ${lastError}`);
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error(`publisher dispatch failed: ${lastError}`);
          NODE
            if [ "$cycle" -lt 48 ]; then sleep 300; fi
          done

      - name: Relay to next watchdog run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "dispatching successor watchdog run"
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/watchdog-dispatch-response.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/flood-crossview-watchdog-v2.yml/dispatches \
              -d '{"ref":"main"}')
            if [ "$code" = "204" ]; then
              echo "successor watchdog dispatched"
              exit 0
            fi
            echo "watchdog relay attempt ${attempt} failed: HTTP ${code}"
            cat /tmp/watchdog-dispatch-response.txt || true
            sleep 5
          done
          exit 1
