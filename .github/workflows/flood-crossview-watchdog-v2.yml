name: CrossView flood stale-feed watchdog v2

on:
  workflow_dispatch:
  schedule:
    # Five minutes after the v2 primary slots. The :04 slot is only a backup;
    # the next primary still runs at :09 if GitHub is busy near the top of the hour.
    - cron: "4,14,24,34,44,54 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/flood-crossview-watchdog-v2.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: flood-crossview-watchdog-v2
  cancel-in-progress: true

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public feed and recover if stale
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const statusUrl = `https://raw.githubusercontent.com/Shiraishi1996/ri/flood-live-data/status.json?ts=${Date.now()}`;
          let stale = true;
          try {
            const r = await fetch(statusUrl, { cache: 'no-store' });
            if (!r.ok) throw new Error(`HTTP ${r.status}`);
            const s = await r.json();
            const t = Date.parse(s.generated_at || '');
            const age = Number.isFinite(t) ? (Date.now() - t) / 60000 : 9999;
            const count = Number(s.feature_count || 0);
            console.log(`generated_at=${s.generated_at}; age=${age.toFixed(2)} min; features=${count}; publisher=${s.publisher}`);
            stale = age >= 15 || count < 20000;
          } catch (e) {
            console.log(`status check failed: ${e.message}`);
            stale = true;
          }

          if (!stale) {
            console.log('feed is fresh; no recovery dispatch needed');
            process.exit(0);
          }

          console.log('feed is stale; dispatching v2 primary workflow');
          const api = 'https://api.github.com/repos/Shiraishi1996/ri/actions/workflows/flood-crossview-live-v2.yml/dispatches';
          let lastError = '';
          for (let attempt = 1; attempt <= 3; attempt++) {
            const rr = await fetch(api, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ ref: 'main' })
            });
            if (rr.ok) {
              console.log(`recovery workflow dispatched on attempt ${attempt}`);
              process.exit(0);
            }
            lastError = `${rr.status}: ${await rr.text()}`;
            console.log(`dispatch attempt ${attempt} failed: ${lastError}`);
            await new Promise(r => setTimeout(r, 3000));
          }
          throw new Error(`workflow dispatch failed after retries: ${lastError}`);
          NODE
